    // Composant Démonstrateur/Transformateur interactif d'adjectifs
    function TransformateurAdjectifs({ words, addPoints }) {
      const [selectedIndex, setSelectedIndex] = useState(0);
      const [isTransformed, setIsTransformed] = useState(false);
      const [customInput, setCustomInput] = useState('');
      const [customFeedback, setCustomFeedback] = useState(null);

      const currentWord = words[selectedIndex];

      const handleTransform = () => {
        if (!isTransformed) {
          setIsTransformed(true);
          addPoints(5);
        }
      };

      const handleNext = () => {
        setIsTransformed(false);
        setSelectedIndex((prev) => (prev + 1) % words.length);
      };

      const handleTestCustom = (e) => {
        e.preventDefault();
        const trimmed = customInput.trim().toLowerCase();
        if (!trimmed) return;

        const found = words.find(w => w.m.toLowerCase() === trimmed);
        if (found) {
          setCustomFeedback({
            success: true,
            msg: `Bravo ! ${found.m} → ${found.f} (${found.rule})`
          });
          addPoints(10);
        } else {
          let f = trimmed + 'e';
          if (trimmed.endsWith('e')) f = trimmed;
          setCustomFeedback({
            success: true,
            msg: `Forme féminine probable : "${trimmed}" → "${f}" (Selon la règle générale).`
          });
        }
      };

      return (
        <div className="space-y-6 animate-fadeIn">
          {/* Card principale de transformation */}
          <div className="bg-white p-6 md:p-8 rounded-3xl shadow-md border border-slate-200 text-center relative overflow-hidden">

                <button
                  onClick={handleTransform}
                  className={`p-5 rounded-full font-bold text-2xl shadow-lg transition-all duration-300 transform active:scale-95 ${
                    isTransformed
                      ? 'bg-emerald-500 text-white rotate-90 md:rotate-0'
                      : 'bg-amber-400 text-amber-950 hover:bg-amber-300 animate-pulse'
                  }`}
                  title="Transformer au féminin"

                  ⚡
                </button>
                <span className="text-xs font-bold text-slate-500 mt-2">
                  {isTransformed ? "Transformé !" : "Clique pour transformer"}
                </span>
              </div>

              {/* Carte Féminin */}
              <div className={`w-full md:w-64 p-6 rounded-2xl border-2 shadow-sm transition-all duration-500 ${
                isTransformed
                  ? 'bg-indigo-50 border-indigo-400 scale-105'
                  : 'bg-slate-50 border-dashed border-slate-300 opacity-60'
              }`}>
                <span className="text-xs font-bold text-indigo-400 uppercase tracking-widest block mb-1">Féminin</span>
                <span className={`text-3xl font-extrabold font-heading ${isTransformed ? 'text-indigo-600' : 'text-slate-400'}`}>
                  {isTransformed ? currentWord.f : '???'}
                </span>
              </div>
            </div>

            {/* Explication de la règle appliquée */}
            {isTransformed && (
              <div className="mt-6 bg-emerald-50 border border-emerald-200 text-emerald-900 p-4 rounded-2xl max-w-xl mx-auto text-base font-semibold animate-fadeIn">

    // Composant Jeu d'Association (Match & Select)
    function AssociationGame({ items, addPoints }) {
      const [selectedMasculin, setSelectedMasculin] = useState(null);
      const [matchedPairIds, setMatchedPairIds] = useState([]);
      const [feedback, setFeedback] = useState(null);
      const [shuffledFeminine, setShuffledFeminine] = useState([]);

      useEffect(() => {
        const femList = items.map(item => ({ id: item.id, f: item.f }));
        setShuffledFeminine([...femList].sort(() => Math.random() - 0.5));
      }, [items]);

      const handleSelectMasculin = (item) => {
        if (matchedPairIds.includes(item.id)) return;
        setSelectedMasculin(item);
        setFeedback(null);
      };

      const handleSelectFeminin = (femItem) => {
        if (!selectedMasculin) {
          setFeedback({ type: 'warning', msg: 'Choisis d\'abord un nom masculin dans la colonne de gauche ! 👈' });
          return;
        }

        if (matchedPairIds.includes(femItem.id)) return;

        if (selectedMasculin.id === femItem.id) {
          setMatchedPairIds(prev => [...prev, femItem.id]);
          setSelectedMasculin(null);
          setFeedback({ type: 'success', msg: `🟢 Bravo ! "${selectedMasculin.m}" s'associe bien avec "${femItem.f}".` });
          addPoints(15);
        } else {
          setFeedback({ type: 'error', msg: `🔴 Oups ! "${selectedMasculin.m}" ne correspond pas à "${femItem.f}". Réessaie !` });
        }
      };

      const handleReset = () => {
        setMatchedPairIds([]);
        setSelectedMasculin(null);
        setFeedback(null);
        setShuffledFeminine([...items.map(item => ({ id: item.id, f: item.f }))].sort(() => Math.random() - 0.5));
      };

      const isComplete = matchedPairIds.length === items.length;

      return (
        <div className="bg-white p-6 md:p-8 rounded-3xl shadow-md border border-slate-200 space-y-6 animate-fadeIn">
          <div className="flex flex-wrap items-center justify-between gap-4 border-b pb-4">
            <div>
              <h2 className="text-2xl font-bold font-heading text-purple-900">🧩 Associe les Paires (Masculin ➔ Féminin)</h2>
              <p className="text-slate-600 text-sm">Clique sur un mot masculin à gauche, puis clique sur son équivalent féminin à droite !</p>
            </div>
            <button
              onClick={handleReset}
              className="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-xl text-sm font-bold transition"
            >
              🔄 Réinitialiser
            </button>
          </div>

          {feedback && (
            <div className={`p-4 rounded-2xl font-bold text-sm md:text-base border ${
              feedback.type === 'success' ? 'bg-emerald-50 text-emerald-800 border-emerald-300' :
              feedback.type === 'error' ? 'bg-rose-50 text-rose-800 border-rose-300' :
              'bg-amber-50 text-amber-800 border-amber-300'
            }`}>
              {feedback.msg}
            </div>
          )}

          <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div className="space-y-3">
              <h3 className="font-heading font-bold text-slate-400 uppercase tracking-wider text-xs">Noms Masculins</h3>
              {items.map((item) => {
                const isMatched = matchedPairIds.includes(item.id);
                const isSelected = selectedMasculin?.id === item.id;

                return (
                  <button
                    key={item.id}
                    disabled={isMatched}
                    onClick={() => handleSelectMasculin(item)}
                    className={`w-full p-4 rounded-2xl text-left font-bold text-base md:text-lg transition-all flex items-center justify-between border-2 ${
                      isMatched
                        ? 'bg-emerald-50 border-emerald-400 text-emerald-700 opacity-60 cursor-not-allowed'
                        : isSelected
                        ? 'bg-purple-100 border-purple-600 text-purple-900 shadow-md ring-2 ring-purple-300 scale-102'
                        : 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100 hover:border-slate-300'
                    }`}
                  >
                    <span>{item.m}</span>
                    {isMatched ? <span>✅</span> : <span className="text-xs bg-slate-200 text-slate-600 px-2.5 py-1 rounded-full">{item.type}</span>}
                  </button>
                );
              })}
            </div>

            <div className="space-y-3">
              <h3 className="font-heading font-bold text-slate-400 uppercase tracking-wider text-xs">Noms Féminins</h3>
              {shuffledFeminine.map((femItem) => {
                const isMatched = matchedPairIds.includes(femItem.id);

                return (
                  <button
                    key={femItem.id}
                    disabled={isMatched}
                    onClick={() => handleSelectFeminin(femItem)}
                    className={`w-full p-4 rounded-2xl text-left font-bold text-base md:text-lg transition-all flex items-center justify-between border-2 ${
                      isMatched
                        ? 'bg-emerald-50 border-emerald-400 text-emerald-700 opacity-60 cursor-not-allowed'
                        : 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-purple-50 hover:border-purple-300'
                    }`}
                  >
                    <span>{femItem.f}</span>
                    {isMatched && <span>✅</span>}
                  </button>
                );
              })}
            </div>
          </div>

          {isComplete && (
            <div className="bg-gradient-to-r from-emerald-500 to-teal-600 text-white p-6 rounded-3xl text-center space-y-3 animate-fadeIn">
              <h3 className="text-2xl font-bold font-heading">🎉 Incroyable ! Tu as associé toutes les paires !</h3>
              <p className="text-emerald-100 font-medium">Tu maîtrises parfaitement le féminin des noms !</p>
              <button
                onClick={handleReset}
                className="bg-white text-emerald-800 font-bold px-6 py-3 rounded-2xl shadow hover:bg-emerald-50 transition"
              >
                Rejouer 🔄
              </button>
            </div>
          )}
        </div>
      );
    }

    // Composant Détective des Mots
    function DetectiveGame({ questions, addPoints }) {
      const [currentIndex, setCurrentIndex] = useState(0);
      const [userInputs, setUserInputs] = useState({});
      const [feedback, setFeedback] = useState(null);
      const [isCompleted, setIsCompleted] = useState(false);

      const currentQ = questions[currentIndex];

      const handleInputChange = (targetText, value) => {
        setUserInputs(prev => ({ ...prev, [targetText]: value }));
      };

      const handleVerify = () => {
        let allCorrect = true;
        const details = [];

        currentQ.targets.forEach((target) => {
          const userVal = (userInputs[target.text] || '').trim().toLowerCase();
          const expectedVal = target.f.toLowerCase();

          if (userVal === expectedVal) {
            details.push({ word: target.text, status: 'ok', msg: `🟢 ${target.text} → ${target.f}` });
          } else {
            allCorrect = false;
            details.push({ word: target.text, status: 'error', msg: `🔴 ${target.text} : tu as écrit "${userVal || '...'}" au lieu de "${target.f}"` });
          }
        });

        if (allCorrect) {
          setFeedback({ success: true, details, msg: "Bravo Détective ! Toute la phrase est correcte !" });
          addPoints(25);
        } else {
          setFeedback({ success: false, details, msg: "Quelques erreurs se sont glissées ! Regarde les détails ci-dessous :" });
        }
      };

      const handleNext = () => {
        setUserInputs({});
        setFeedback(null);
        if (currentIndex < questions.length - 1) {
          setCurrentIndex(prev => prev + 1);
        } else {
          setIsCompleted(true);
        }
      };

      return (
        <div className="bg-white p-6 md:p-8 rounded-3xl shadow-md border border-slate-200 space-y-6 animate-fadeIn">
          <div className="border-b pb-4 flex justify-between items-center">
            <div>
              <span className="text-xs font-bold text-purple-600 bg-purple-100 px-3 py-1 rounded-full uppercase tracking-wider">
                Mission Détective #{currentIndex + 1}
              </span>
              <h2 className="text-2xl font-bold font-heading text-slate-800 mt-2">
                Transforme la phrase au féminin !
              </h2>
            </div>
            <span className="text-3xl">🕵️‍♂️</span>
          </div>

          {!isCompleted ? (
            <div className="space-y-6">
              <div className="bg-slate-50 p-6 rounded-2xl border border-slate-200 text-lg font-medium text-slate-800 leading-relaxed">
                <span className="font-bold text-slate-500 block mb-2 text-sm uppercase">Phrase originale au masculin :</span>
                <p className="text-xl font-heading text-indigo-950">{currentQ.sentence}</p>
              </div>

              <div className="space-y-4">
                <h3 className="font-bold text-slate-700 text-base">Écris la forme féminine pour chaque mot entre crochets :</h3>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  {currentQ.targets.map((target, idx) => (
                    <div key={idx} className="bg-purple-50/50 p-4 rounded-2xl border border-purple-100 flex flex-col gap-2">
                      <label className="text-sm font-bold text-purple-900">
                        Mot masculin : <span className="underline font-extrabold text-indigo-700">{target.text}</span>
                      </label>
                      <input
                        type="text"
                        value={userInputs[target.text] || ''}
                        onChange={(e) => handleInputChange(target.text, e.target.value)}
                        placeholder={`Féminin de ${target.text}...`}
                        className="px-4 py-2.5 rounded-xl border border-slate-300 text-slate-800 font-semibold outline-none focus:ring-2 focus:ring-purple-400"
                      />
                    </div>
                  ))}
                </div>
              </div>

              <div className="text-xs md:text-sm text-slate-500 bg-slate-100 p-3 rounded-xl flex items-center gap-2">
                <span>💡 Indice du détective :</span>
                <span>{currentQ.hint}</span>
              </div>

              {feedback && (
                <div className={`p-5 rounded-2xl border font-semibold space-y-2 ${
                  feedback.success ? 'bg-emerald-50 border-emerald-300 text-emerald-900' : 'bg-rose-50 border-rose-300 text-rose-900'
                }`}>
                  <p className="text-base font-bold">{feedback.msg}</p>
                  <ul className="text-sm space-y-1">
                    {feedback.details.map((d, i) => (
                      <li key={i}>{d.msg}</li>
                    ))}
                  </ul>
                  {feedback.success && (
                    <div className="mt-3 bg-white/80 p-3 rounded-xl border border-emerald-200">
                      <span className="text-xs font-bold text-slate-500 uppercase block">Phrase complète transformée :</span>
                      <p className="text-emerald-900 font-bold font-heading text-lg">{currentQ.fullFeminine}</p>
                    </div>
                  )}
                </div>
              )}

              <div className="flex justify-end gap-3 pt-4 border-t">
                {!feedback?.success ? (
                  <button
                    onClick={handleVerify}
                    className="bg-purple-600 text-white font-bold px-8 py-3 rounded-2xl hover:bg-purple-700 transition shadow-md active:scale-95 text-lg"
                  >
                    Vérifier la réponse 🔍
                  </button>
                ) : (
                  <button
                    onClick={handleNext}
                    className="bg-emerald-600 text-white font-bold px-8 py-3 rounded-2xl hover:bg-emerald-700 transition shadow-md active:scale-95 text-lg"
                  >
                    Mission Suivante ➡️
                  </button>
                )}
              </div>
            </div>
          ) : (
            <div className="bg-gradient-to-r from-purple-600 to-indigo-700 text-white p-8 rounded-3xl text-center space-y-4">
              <span className="text-5xl">🏆</span>
              <h3 className="text-3xl font-bold font-heading">Félicitations Détective !</h3>
              <p className="text-purple-100 text-lg">Tu as complété toutes les enquêtes sur le féminin des noms avec succès !</p>
              <button
                onClick={() => {
                  setCurrentIndex(0);
                  setIsCompleted(false);
                  setUserInputs({});
                  setFeedback(null);
                }}
                className="bg-yellow-400 text-purple-950 font-bold px-8 py-3 rounded-2xl hover:bg-yellow-300 transition shadow-lg text-lg"
              >
                Recommencer les enquêtes 🔄
              </button>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // COMPOSANT QUIZ / QCM
    // ==========================================
    function QuizComponent({ questions, addPoints, title }) {
      const [currentIndex, setCurrentIndex] = useState(0);
      const [selectedOption, setSelectedOption] = useState(null);
      const [showHint, setShowHint] = useState(false);
      const [isAnswered, setIsAnswered] = useState(false);
      const [quizScore, setQuizScore] = useState(0);
      const [isFinished, setIsFinished] = useState(false);

      const currentQ = questions[currentIndex];

      const handleSelectOption = (index) => {
        if (isAnswered) return;
        setSelectedOption(index);
      };

      const handleValidate = () => {
        if (selectedOption === null || isAnswered) return;
        setIsAnswered(true);

        if (selectedOption === currentQ.answer) {
          setQuizScore(prev => prev + 1);
          addPoints(20);
        }
      };

      const handleNextQuestion = () => {
        setSelectedOption(null);
        setShowHint(false);
        setIsAnswered(false);

        if (currentIndex < questions.length - 1) {
          setCurrentIndex(prev => prev + 1);
        } else {
          setIsFinished(true);
        }
      };

      const handleRestartQuiz = () => {
        setCurrentIndex(0);
        setSelectedOption(null);
        setShowHint(false);
        setIsAnswered(false);
        setQuizScore(0);
        setIsFinished(false);
      };

      return (
        <div className="bg-white p-6 md:p-8 rounded-3xl shadow-md border border-slate-200 space-y-6 animate-fadeIn">
          <div className="flex flex-wrap items-center justify-between gap-4 border-b pb-4">
            <div>
              <h2 className="text-xl md:text-2xl font-bold font-heading text-indigo-950">{title}</h2>
              <p className="text-slate-500 text-sm">Question {currentIndex + 1} sur {questions.length}</p>
            </div>
            
            <div className="w-full md:w-48 bg-slate-100 rounded-full h-3 overflow-hidden border">
              <div
                className="bg-indigo-600 h-full transition-all duration-300"
                style={{ width: `${((currentIndex + 1) / questions.length) * 100}%` }}
              ></div>
            </div>
          </div>

          {!isFinished ? (
            <div className="space-y-6">
              <div className="bg-indigo-50/70 p-6 rounded-2xl border border-indigo-100">
                <h3 className="text-lg md:text-xl font-bold text-indigo-900 font-heading">
                  {currentQ.question}
                </h3>
              </div>

              <div>
                {!showHint ? (
                  <button
                    onClick={() => setShowHint(true)}
                    className="text-xs font-bold text-amber-700 bg-amber-100 hover:bg-amber-200 px-3.5 py-1.5 rounded-xl transition flex items-center gap-1.5"
                  >
                    💡 Demander un indice
                  </button>
                ) : (
                  <div className="bg-amber-50 border-l-4 border-amber-400 p-3 rounded-r-xl text-xs md:text-sm text-amber-900 animate-fadeIn">
                    <span className="font-bold">Indice : </span>{currentQ.hint}
                  </div>
                )}
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {currentQ.options.map((option, idx) => {
                  let btnStyle = 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-indigo-50 hover:border-indigo-300';
                  
                  if (selectedOption === idx) {
                    btnStyle = 'bg-indigo-100 border-indigo-500 text-indigo-900 font-bold ring-2 ring-indigo-300';
                  }

                  if (isAnswered) {
                    if (idx === currentQ.answer) {
                      btnStyle = 'bg-emerald-100 border-emerald-500 text-emerald-900 font-bold ring-2 ring-emerald-400';
                    } else if (selectedOption === idx) {
                      btnStyle = 'bg-rose-100 border-rose-500 text-rose-900 font-bold';
                    } else {
                      btnStyle = 'bg-slate-50 border-slate-200 text-slate-400 opacity-50';
                    }
                  }

                  return (
                    <button
                      key={idx}
                      disabled={isAnswered}
                      onClick={() => handleSelectOption(idx)}
                      className={`p-4 rounded-2xl border-2 text-left text-base md:text-lg font-medium transition-all flex items-center justify-between ${btnStyle}`}
                    >
                      <span>{option}</span>
                      {isAnswered && idx === currentQ.answer && <span>🟢</span>}
                      {isAnswered && selectedOption === idx && idx !== currentQ.answer && <span>🔴</span>}
                    </button>
                  );
                })}
              </div>

              {isAnswered && (
                <div className={`p-4 rounded-2xl text-sm md:text-base font-semibold border animate-fadeIn ${
                  selectedOption === currentQ.answer
                    ? 'bg-emerald-50 text-emerald-900 border-emerald-200'
                    : 'bg-rose-50 text-rose-900 border-rose-200'
                }`}>
                  <p className="font-bold mb-1">
                    {selectedOption === currentQ.answer ? '🎉 Bonne réponse !' : '❌ Mauvaise réponse.'}
                  </p>
                  <p className="font-normal text-slate-700">{currentQ.explanation}</p>
                </div>
              )}

              <div className="flex justify-end pt-4 border-t">
                {!isAnswered ? (
                  <button
                    disabled={selectedOption === null}
                    onClick={handleValidate}
                    className={`px-8 py-3 rounded-2xl font-bold text-lg shadow-md transition ${
                      selectedOption !== null
                        ? 'bg-indigo-600 text-white hover:bg-indigo-700 active:scale-95'
                        : 'bg-slate-200 text-slate-400 cursor-not-allowed'
                    }`}
                  >
                    Valider 🚀
                  </button>
                ) : (
                  <button
                    onClick={handleNextQuestion}
                    className="bg-indigo-600 text-white px-8 py-3 rounded-2xl font-bold text-lg hover:bg-indigo-700 transition shadow-md active:scale-95"
                  >
                    {currentIndex < questions.length - 1 ? 'Question Suivante ➡️' : 'Voir mon Résultat 🏆'}
                  </button>
                )}
              </div>
            </div>
          ) : (
            <div className="text-center py-8 space-y-6 animate-fadeIn">
              <div className="inline-block bg-yellow-100 text-yellow-800 p-6 rounded-full text-5xl mb-2">
                🏆
              </div>
              <h3 className="text-3xl font-bold font-heading text-indigo-950">Quiz Terminé !</h3>
              <p className="text-xl font-medium text-slate-600">
                Tu as obtenu <span className="font-bold text-indigo-600 text-2xl">{quizScore}</span> sur <span className="font-bold text-2xl">{questions.length}</span> !
              </p>

              {quizScore === questions.length ? (
                <p className="text-emerald-600 font-bold text-lg">Score parfait ! Tu es un véritable champion de la grammaire ! 🥇</p>
              ) : quizScore >= questions.length / 2 ? (
                <p className="text-indigo-600 font-bold text-lg">Très bon travail ! Continue comme ça ! 👍</p>
              ) : (
                <p className="text-amber-600 font-bold text-lg">N'hésite pas à relire les cartes de cours et à réessayer ! 💪</p>
              )}

              <div className="pt-4">
                <button
                  onClick={handleRestartQuiz}
                  className="bg-indigo-600 text-white font-bold px-8 py-3.5 rounded-2xl hover:bg-indigo-700 transition shadow-lg text-lg"
                >
                  Recommencer le Quiz 🔄
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Rendu principal ReactDOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
